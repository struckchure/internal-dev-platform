definitions:
  db.DeploymentLogModel:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      deployment:
        $ref: '#/definitions/db.DeploymentModel'
      deploymentId:
        type: string
      id:
        type: string
      jobId:
        type: string
      message:
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - deploymentId
    - id
    - updatedAt
    type: object
  db.DeploymentModel:
    properties:
      DeploymentLog:
        items:
          $ref: '#/definitions/db.DeploymentLogModel'
        type: array
      actor:
        type: string
      commitHash:
        type: string
      commitMessage:
        type: string
      createdAt:
        type: string
      deletedAt:
        type: string
      id:
        type: string
      machine:
        $ref: '#/definitions/db.MachineModel'
      machineId:
        type: string
      repoConnection:
        $ref: '#/definitions/db.RepoConnectionModel'
      repoConnectionId:
        type: string
      status:
        $ref: '#/definitions/db.DeploymentStatus'
      updatedAt:
        type: string
    required:
    - createdAt
    - id
    - machineId
    - repoConnectionId
    - status
    - updatedAt
    type: object
  db.DeploymentStatus:
    enum:
    - IDLE
    - IN_PROGRESS
    - SUCCESSFUL
    - FAILED
    type: string
    x-enum-varnames:
    - DeploymentStatusIdle
    - DeploymentStatusInProgress
    - DeploymentStatusSuccessful
    - DeploymentStatusFailed
  db.GithubAccountConnectionModel:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      githubEmail:
        type: string
      githubId:
        type: string
      githubInstallationId:
        type: integer
      githubUsername:
        type: string
      id:
        type: string
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/db.UserModel'
      userId:
        type: string
    required:
    - createdAt
    - id
    - updatedAt
    - userId
    type: object
  db.MachineModel:
    properties:
      Deployment:
        items:
          $ref: '#/definitions/db.DeploymentModel'
        type: array
      Network:
        items:
          $ref: '#/definitions/db.NetworkModel'
        type: array
      RepoConnection:
        items:
          $ref: '#/definitions/db.RepoConnectionModel'
        type: array
      containerId:
        type: string
      cpu:
        type: string
      createdAt:
        type: string
      deletedAt:
        type: string
      id:
        type: string
      machineImage:
        type: string
      machineName:
        type: string
      machineStatus:
        $ref: '#/definitions/db.MachineStatus'
      memory:
        type: string
      owner:
        $ref: '#/definitions/db.UserModel'
      ownerId:
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - id
    - machineStatus
    - ownerId
    - updatedAt
    type: object
  db.MachineStatus:
    enum:
    - CREATING
    - RUNNING
    - REBOOTING
    - SHUTTING_DOWN
    - SHUTDOWN
    type: string
    x-enum-varnames:
    - MachineStatusCreating
    - MachineStatusRunning
    - MachineStatusRebooting
    - MachineStatusShuttingDown
    - MachineStatusShutdown
  db.NetworkModel:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      destinationPort:
        type: integer
      hostName:
        type: string
      id:
        type: string
      ingressId:
        type: string
      listeningPort:
        type: integer
      machine:
        $ref: '#/definitions/db.MachineModel'
      machineId:
        type: string
      protocol:
        type: string
      serviceId:
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - destinationPort
    - id
    - listeningPort
    - machineId
    - updatedAt
    type: object
  db.RepoConnectionModel:
    properties:
      Deployment:
        items:
          $ref: '#/definitions/db.DeploymentModel'
        type: array
      createdAt:
        type: string
      deletedAt:
        type: string
      id:
        type: string
      machine:
        $ref: '#/definitions/db.MachineModel'
      machineId:
        type: string
      repoId:
        type: string
      repoName:
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - id
    - machineId
    - updatedAt
    type: object
  db.UserModel:
    properties:
      GithubAccountConnection:
        items:
          $ref: '#/definitions/db.GithubAccountConnectionModel'
        type: array
      Machine:
        items:
          $ref: '#/definitions/db.MachineModel'
        type: array
      createdAt:
        type: string
      deletedAt:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      lastName:
        type: string
      password:
        type: string
      roles:
        items:
          type: string
        type: array
      updatedAt:
        type: string
    required:
    - createdAt
    - id
    - roles
    - updatedAt
    type: object
  handlers.RedirectResult:
    properties:
      link:
        type: string
    required:
    - link
    type: object
  internals.AuthTokens:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    required:
    - accessToken
    - refreshToken
    type: object
  services.DeployRepoArgs:
    properties:
      connectionId:
        type: string
      ref:
        type: string
    required:
    - connectionId
    - ref
    type: object
  types.CreateMachineArgs:
    properties:
      cpu:
        type: string
      machineImage:
        type: string
      machineName:
        type: string
      memory:
        type: string
    required:
    - cpu
    - machineImage
    - machineName
    - memory
    type: object
  types.CreateNetworkArgs:
    properties:
      destinationPort:
        type: integer
      listeningPort:
        type: integer
      machineId:
        type: string
      protocol:
        type: string
    required:
    - destinationPort
    - listeningPort
    - machineId
    - protocol
    type: object
  types.CreateRepoConnectionArgs:
    properties:
      machineId:
        type: string
      repoId:
        type: string
      repoName:
        type: string
    required:
    - machineId
    - repoId
    - repoName
    type: object
  types.LoginUserArgs:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  types.LoginUserResult:
    properties:
      tokens:
        $ref: '#/definitions/internals.AuthTokens'
    required:
    - tokens
    type: object
  types.RefreshAccessTokenArgs:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  types.RegisterUserArgs:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        type: string
    required:
    - email
    - firstName
    - lastName
    - password
    type: object
  types.RegisterUserResult:
    properties:
      GithubAccountConnection:
        items:
          $ref: '#/definitions/db.GithubAccountConnectionModel'
        type: array
      Machine:
        items:
          $ref: '#/definitions/db.MachineModel'
        type: array
      createdAt:
        type: string
      deletedAt:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      lastName:
        type: string
      password:
        type: string
      roles:
        items:
          type: string
        type: array
      tokens:
        $ref: '#/definitions/internals.AuthTokens'
      updatedAt:
        type: string
    required:
    - createdAt
    - id
    - roles
    - tokens
    - updatedAt
    type: object
  types.Repository:
    properties:
      fullName:
        type: string
      id:
        type: integer
      name:
        type: string
      private:
        type: boolean
      url:
        type: string
    required:
    - fullName
    - id
    - name
    - private
    - url
    type: object
  types.UpdateMachineArgs:
    properties:
      cpu:
        type: string
      machineImage:
        type: string
      machineName:
        type: string
      memory:
        type: string
      ownerId:
        type: string
    required:
    - cpu
    - machineImage
    - machineName
    - memory
    - ownerId
    type: object
  types.UpdateRepoConnectionArgs:
    properties:
      machineId:
        type: string
      repoId:
        type: string
      repoName:
        type: string
    required:
    - machineId
    - repoId
    - repoName
    type: object
  types.UpdateUserArgs:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        type: string
    required:
    - firstName
    - lastName
    - password
    type: object
info:
  contact:
    email: idp@overal-x.org
    name: idp Team
  title: idp API
  version: "1.0"
paths:
  /auth/login/:
    post:
      consumes:
      - application/json
      operationId: loginUser
      parameters:
      - description: Login User
        in: body
        name: args
        required: true
        schema:
          $ref: '#/definitions/types.LoginUserArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.LoginUserResult'
      tags:
      - auth
  /auth/refresh-access-token/:
    post:
      consumes:
      - application/json
      operationId: refreshAccessToken
      parameters:
      - description: Refresh Access Token
        in: body
        name: args
        required: true
        schema:
          $ref: '#/definitions/types.RefreshAccessTokenArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.LoginUserResult'
      tags:
      - auth
  /auth/register/:
    post:
      consumes:
      - application/json
      operationId: registerUser
      parameters:
      - description: Register User
        in: body
        name: args
        required: true
        schema:
          $ref: '#/definitions/types.RegisterUserArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/types.RegisterUserResult'
      tags:
      - auth
  /deployments:
    get:
      consumes:
      - application/json
      operationId: listDeployments
      parameters:
      - description: Machine Id
        in: query
        name: machineId
        type: string
      - in: query
        name: machineId
        required: true
        type: string
      - in: query
        name: repoConnectionId
        required: true
        type: string
      - in: query
        name: search
        required: true
        type: string
      - in: query
        name: skip
        required: true
        type: integer
      - in: query
        name: sortBy
        required: true
        type: string
      - in: query
        name: take
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.DeploymentModel'
            type: array
      tags:
      - deployments
  /deployments/{deploymentId}:
    get:
      consumes:
      - application/json
      operationId: getDeploymentById
      parameters:
      - description: Deployment Id
        in: path
        name: deploymentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.DeploymentModel'
      tags:
      - deployments
  /deployments/{deploymentId}/logs:
    get:
      consumes:
      - application/json
      operationId: listDeploymentLogsById
      parameters:
      - description: Deployment Id
        in: path
        name: deploymentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.DeploymentLogModel'
            type: array
      tags:
      - deployments
  /deployments/deploy:
    post:
      consumes:
      - application/json
      operationId: deployRepo
      parameters:
      - description: Deploy Repo
        in: body
        name: args
        required: true
        schema:
          $ref: '#/definitions/services.DeployRepoArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      tags:
      - deployments
  /gh/account-connections:
    get:
      consumes:
      - application/json
      operationId: listAccountConnections
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.GithubAccountConnectionModel'
            type: array
      tags:
      - github
  /gh/authorize:
    get:
      consumes:
      - application/json
      operationId: authorizeGithubAccount
      parameters:
      - in: query
        name: redirectUrl
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.RedirectResult'
      tags:
      - github
  /gh/repos:
    get:
      consumes:
      - application/json
      operationId: ListRepositories
      parameters:
      - default: 1
        in: query
        name: pageNumber
        type: integer
      - default: 20
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/types.Repository'
            type: array
      tags:
      - github
  /gh/update-app-access:
    get:
      consumes:
      - application/json
      operationId: updateAppAccess
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.RedirectResult'
      tags:
      - github
  /machine:
    get:
      consumes:
      - application/json
      operationId: listMachines
      parameters:
      - in: query
        name: search
        required: true
        type: string
      - in: query
        name: skip
        required: true
        type: integer
      - in: query
        name: sortBy
        required: true
        type: string
      - in: query
        name: take
        required: true
        type: integer
      - in: query
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.MachineModel'
            type: array
      tags:
      - machines
    post:
      consumes:
      - application/json
      operationId: createMachine
      parameters:
      - description: List Machine
        in: body
        name: args
        required: true
        schema:
          $ref: '#/definitions/types.CreateMachineArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/db.MachineModel'
      tags:
      - machines
  /machine/{machineId}:
    delete:
      consumes:
      - application/json
      operationId: deleteMachine
      parameters:
      - description: Machine Id
        in: path
        name: machineId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      tags:
      - machines
    get:
      consumes:
      - application/json
      operationId: getMachine
      parameters:
      - description: Machine Id
        in: path
        name: machineId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.MachineModel'
      tags:
      - machines
    patch:
      consumes:
      - application/json
      operationId: updateMachine
      parameters:
      - description: Machine Id
        in: path
        name: machineId
        required: true
        type: string
      - description: Update Machine
        in: body
        name: args
        required: true
        schema:
          $ref: '#/definitions/types.UpdateMachineArgs'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
      tags:
      - machines
  /network:
    get:
      consumes:
      - application/json
      operationId: listNetworks
      parameters:
      - in: query
        name: machineId
        type: string
      - in: query
        name: search
        required: true
        type: string
      - in: query
        name: skip
        required: true
        type: integer
      - in: query
        name: sortBy
        required: true
        type: string
      - in: query
        name: take
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.NetworkModel'
            type: array
      tags:
      - network
    post:
      consumes:
      - application/json
      operationId: createNetwork
      parameters:
      - description: List Networks
        in: body
        name: args
        required: true
        schema:
          $ref: '#/definitions/types.CreateNetworkArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/db.NetworkModel'
      tags:
      - network
  /network/{networkId}:
    delete:
      consumes:
      - application/json
      operationId: deleteNetwork
      parameters:
      - description: Network Id
        in: path
        name: networkId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      tags:
      - network
  /repo-connection:
    get:
      consumes:
      - application/json
      operationId: listRepoConnections
      parameters:
      - in: query
        name: machineId
        type: string
      - in: query
        name: search
        required: true
        type: string
      - in: query
        name: skip
        required: true
        type: integer
      - in: query
        name: sortBy
        required: true
        type: string
      - in: query
        name: take
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.RepoConnectionModel'
            type: array
      tags:
      - repo-connection
    post:
      consumes:
      - application/json
      operationId: createRepoConnection
      parameters:
      - description: Create Repo Connection
        in: body
        name: args
        required: true
        schema:
          $ref: '#/definitions/types.CreateRepoConnectionArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/db.RepoConnectionModel'
      tags:
      - repo-connection
  /repo-connection/{connectionId}:
    delete:
      consumes:
      - application/json
      operationId: deleteRepoConnection
      parameters:
      - description: Repo Connection Id
        in: path
        name: connectionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      tags:
      - repo-connection
    get:
      consumes:
      - application/json
      operationId: getRepoConnection
      parameters:
      - description: Repo Connection Id
        in: path
        name: connectionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/db.RepoConnectionModel'
      tags:
      - repo-connection
    patch:
      consumes:
      - application/json
      operationId: updateRepoConnection
      parameters:
      - description: Repo Connection Id
        in: path
        name: connectionId
        required: true
        type: string
      - description: Update Repo Connection
        in: body
        name: args
        required: true
        schema:
          $ref: '#/definitions/types.UpdateRepoConnectionArgs'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/db.RepoConnectionModel'
      tags:
      - repo-connection
  /user/profile/:
    get:
      consumes:
      - application/json
      operationId: getProfileUser
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.UserModel'
      tags:
      - user
    patch:
      consumes:
      - application/json
      operationId: updateProfileUser
      parameters:
      - description: Update User
        in: body
        name: args
        required: true
        schema:
          $ref: '#/definitions/types.UpdateUserArgs'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/db.UserModel'
      tags:
      - user
swagger: "2.0"
